schema_version: "1.1"
name: claude-kb-lookup-loads-29
tags: [claude-kb-lookup, should-load]
description: "Claude API (kb-claude-api.md)."
execution:
  prompt: "Our Messages API call with tool_choice set to a specific tool started returning 400 after we switched it to Sonnet 5.5. Is that a known restriction, and what should we send instead?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
