schema_version: "1.1"
name: claude-kb-lookup-skips-22
tags: [claude-kb-lookup, near-miss]
description: "Near miss: a routine browser check."
execution:
  prompt: "Open http://localhost:4200 in the browser and take a screenshot at 375 px wide."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
