schema_version: "1.1"
name: claude-kb-lookup-skips-15
tags: [claude-kb-lookup, near-miss]
description: "Near miss: a routine gh action, not a question about GitHub behaviour."
execution:
  prompt: "Close issue 42 with a comment saying it was fixed in the last release."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
