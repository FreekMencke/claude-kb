schema_version: "1.1"
name: claude-kb-lookup-loads-51
tags: [claude-kb-lookup, should-load]
description: "Engineering skill packs (kb-skill-packs.md)."
execution:
  prompt: "Should we install Superpowers or Matt Pocock's skills for TDD and planning in Claude Code, and what do they cost in context tokens?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
