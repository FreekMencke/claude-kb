schema_version: "1.1"
name: claude-kb-lookup-skips-16
tags: [claude-kb-lookup, near-miss]
description: "Near miss: an image tag bump in a manifest, not a question about Kubernetes or Flux."
execution:
  prompt: "Bump the api image tag in k8s/api/deployment.yaml from 1.4.2 to 1.4.3."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
