schema_version: "1.1"
name: claude-kb-lookup-loads-24
tags: [claude-kb-lookup, should-load]
description: "Dependency upgrades and GitHub Actions (kb-js-upgrades.md, kb-github-actions.md)."
execution:
  prompt: "Should a session merge a green Dependabot PR that bumps actions/checkout to a new major, and should those actions be pinned by SHA?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
