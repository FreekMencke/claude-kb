schema_version: "1.1"
name: claude-kb-lookup-skips-13
tags: [claude-kb-lookup, near-miss]
description: "Near miss: an accessibility fix in code, not a question about accessibility rules."
execution:
  prompt: "Add alt text to the three images in src/app/home/home.component.html."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
