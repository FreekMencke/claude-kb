schema_version: "1.1"
name: claude-kb-lookup-skips-20
tags: [claude-kb-lookup, near-miss]
description: "Near miss: building an empty state, not a question about which states a view needs."
execution:
  prompt: "Add an empty state with a 'Create your first project' button to src/app/projects/project-list.component.html."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
