schema_version: "1.1"
name: claude-kb-lookup-loads-43
tags: [claude-kb-lookup, should-load]
description: "Vetting a community skill (kb-skills.md)."
execution:
  prompt: "Before I install a skill from a random GitHub repo, what should I check and how do I pin it?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
