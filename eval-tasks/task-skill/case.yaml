schema_version: "1.1"
name: task-skill
tags: [task,should-use]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Write a skill at .claude/skills/release-notes/SKILL.md that drafts release notes from the git log since the last tag."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: reached-kb
    type: regex
    target: trace
    pattern: '\\?"name\\?"\s*:\s*\\?"mcp__[^"\\]*__kb_(?:search|get|quick_answers)\\?"|\\?"skill\\?"\s*:\s*\\?"(?:[\w-]+:)?claude-kb-lookup\\?"'
