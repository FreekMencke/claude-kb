schema_version: "1.1"
name: skip-readme
tags: [task,should-skip]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Add a short README.md saying what this package does and how to run its tests."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: left-kb-alone
    type: regex
    target: trace
    match: not_contains
    pattern: '\\?"name\\?"\s*:\s*\\?"mcp__[^"\\]*__kb_(?:search|get|quick_answers)\\?"|\\?"skill\\?"\s*:\s*\\?"(?:[\w-]+:)?claude-kb-lookup\\?"'
