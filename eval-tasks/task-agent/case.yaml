schema_version: "1.1"
name: task-agent
tags: [task,should-use]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Add a code-reviewer subagent for this repo at .claude/agents/code-reviewer.md, with the model and effort it should use."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: reached-kb
    type: regex
    target: trace
    pattern: '\\?"name\\?"\s*:\s*\\?"mcp__[^"\\]*__kb_(?:search|get|quick_answers)\\?"|\\?"skill\\?"\s*:\s*\\?"(?:[\w-]+:)?claude-kb-lookup\\?"'
