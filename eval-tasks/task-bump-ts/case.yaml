schema_version: "1.1"
name: task-bump-ts
tags: [task,should-use]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Bump this repo to TypeScript 7 in package.json and change whatever else needs changing for it."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: reached-kb
    type: regex
    target: trace
    pattern: '\\?"name\\?"\s*:\s*\\?"mcp__[^"\\]*__kb_(?:search|get|quick_answers)\\?"|\\?"skill\\?"\s*:\s*\\?"(?:[\w-]+:)?claude-kb-lookup\\?"'
