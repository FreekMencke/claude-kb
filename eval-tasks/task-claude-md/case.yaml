schema_version: "1.1"
name: task-claude-md
tags: [task,should-use]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Add a rule to this repo's CLAUDE.md so sessions run npm run verify before they say work is done, and create the file if it's missing."
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: reached-kb
    type: regex
    target: trace
    pattern: '\\?"name\\?"\s*:\s*\\?"mcp__[^"\\]*__kb_(?:search|get|quick_answers)\\?"|\\?"skill\\?"\s*:\s*\\?"(?:[\w-]+:)?claude-kb-lookup\\?"'
