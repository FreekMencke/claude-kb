name: MCP server CD
# Titled like the CI run that started it, instead of every run being called "MCP server CD"
run-name: ${{ github.event.workflow_run.display_title }}

# Deploys the MCP server once its CI (mcp-server.yml) passes on main: builds and pushes the image, then commits its
# digest to mcp-server/claude-kb-mcp.yaml on main. Flux in the cluster applies that commit and reports it as the
# `Flux / sync` commit status; nothing here has cluster access. Copied from freek-mencke-web's CD; rolling back:
# "Deploy" in mcp-server/README.md.
on:
  workflow_run:
    workflows: ['MCP server CI']
    types: [completed]
    branches: ['main']

permissions: {}

jobs:
  deploy:
    # Pushes to main only: a pull request from a fork's branch named main also matches `branches`
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, never cancelled halfway. A newer queued run replaces an older queued one, which is why a run
    # deploys the newest commit on main that passed CI, not only its own.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # contents: write to push the digest commit (main has no branch protection). The token is only given to the steps
    # that need it; the build runs inside Docker, which doesn't see it.
    permissions:
      actions: read
      contents: write
      statuses: read
    env:
      IMAGE: freekmencke/claude-kb-mcp
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        name: Pick the commit to deploy
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          # Files that don't end up in the image (mcp-server/Dockerfile copies only server.py, requirements.txt,
          # scripts/check_kb.py and assets/logo.{png,svg}): a change to only these needs no new image. Nearly every commit is KB content, which
          # the server gets from git-sync. Flux applies mcp-server/claude-kb-mcp.yaml by itself.
          NOT_IN_IMAGE: '^(mcp-server/claude-kb-mcp\.yaml|mcp-server/tests/.*|mcp-server/pyproject\.toml|mcp-server/requirements(-dev)?\.in|mcp-server/requirements-dev\.txt|topics/.*|evals/.*|assets/(banner(-slate)?\.png|logo-slate\.svg)|.*\.md|\.claude/.*|\.claude-plugin/.*|\.github/.*|\.gitignore)$'
        run: .github/scripts/deploy-plan.sh

      - if: steps.plan.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.plan.outputs.deploy == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: image
        if: steps.plan.outputs.deploy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.plan.outputs.sha }}

      # Checked out only now, with credentials to push
      - if: steps.plan.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: .deploy

      - id: commit
        if: steps.plan.outputs.deploy == 'true'
        name: Commit the digest to main
        working-directory: .deploy
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.plan.outputs.sha }}
        run: .github/scripts/deploy-commit.sh

      - if: steps.commit.outputs.sha
        name: Wait for Flux to deploy it
        # main's copy of the script: the root has the commit being deployed checked out, which may predate it
        working-directory: .deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: .github/scripts/deploy-wait-flux.sh

      - if: steps.commit.outputs.sha
        name: Smoke test the server
        working-directory: .deploy # main's copy of the script, as above
        run: .github/scripts/deploy-smoke-test.sh
