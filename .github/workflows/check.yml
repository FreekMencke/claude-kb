name: KB format check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node built-ins only: no npm install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/check-kb.ts
