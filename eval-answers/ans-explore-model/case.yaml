# Criteria from ORCH-005
schema_version: "1.1"
name: ans-explore-model
tags: [answer,post-training]
execution:
  prompt: 'In Claude Code, does the built-in Explore subagent run on Haiku? Does `CLAUDE_CODE_SUBAGENT_MODEL` change it? How do I run it on a cheaper model? Answer in at most six sentences.'
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: main-model
    type: llm
    criteria: |
      PASS if it says Explore runs on the main conversation's model, not Haiku, and that the env var does not change it. Extra correct detail is fine.
      FAIL if it says Explore runs on Haiku, or that the env var changes it.
  - name: override
    type: llm
    criteria: |
      PASS if it says to define a user or project subagent named Explore with `model: haiku`, or to pass `model: haiku` on the call. Extra correct detail is fine.
      FAIL if it gives neither.
